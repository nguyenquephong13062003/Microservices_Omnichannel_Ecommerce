services:
  # ========================================================
  # DISCOVERY & CONFIG SERVICES
  # ========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: ${EUREKA_SERVER_NAME:-eureka-server}
    restart: unless-stopped
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    environment:
      - JAVA_OPTS=${EUREKA_JAVA_OPTS:--Xms128m -Xmx256m}
      - SPRING_APPLICATION_NAME=${EUREKA_SERVER_NAME:-eureka-server}
      - SERVER_PORT=${EUREKA_SERVER_PORT:-8761}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-false}
      - EUREKA_CLIENT_FETCH_REGISTRY=${EUREKA_CLIENT_FETCH_REGISTRY:-false}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-localhost}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-false}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=${EUREKA_MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-never}
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

#volumes:

networks:
  microservices-net:
    driver: bridge